name: handbook checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, fences, and banned options
        run: scripts/validate-docs.sh --static-only

  ffmpeg-8-1-2:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable FFmpeg formula
        run: brew install ffmpeg
      - name: Enforce the handbook baseline
        run: scripts/validate-docs.sh
      - name: Run semantic recipe tests
        run: scripts/test-repaired-recipes.sh
