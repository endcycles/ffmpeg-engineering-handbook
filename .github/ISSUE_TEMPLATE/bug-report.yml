name: Incorrect or failing recipe
description: Report a reproducible handbook defect
title: "[recipe] "
labels: [bug]
body:
  - type: textarea
    id: location
    attributes:
      label: Handbook location
      description: Page, heading, and command.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: FFmpeg version/build, operating system, shell, hardware, and driver when relevant.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input probe
      description: Paste sanitized ffprobe JSON or describe a deterministic fixture.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Complete command and console output
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private media, and identifying paths.
          required: true
